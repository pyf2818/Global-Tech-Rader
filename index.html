    <div id="root"></div>
    <script>window.onerror=function(m,s,l,c,e){document.getElementById('root').innerHTML='<div style="padding:32px;color:#ff6b6b;font-family:monospace;background:#0a0a0f;min-height:100vh"><h2>JS Error</h2><pre style="white-space:pre-wrap;font-size:13px">'+m+'\\n'+s+':'+l+':'+c+'</pre>'+(e&&e.stack?'<pre style="white-space:pre-wrap;font-size:12px;margin-top:12px">'+e.stack+'</pre>':'')+'<button onclick="localStorage.clear();location.reload()" style="margin-top:16px;padding:8px 16px;cursor:pointer">Clear localStorage & Reload</button></div>'};</script>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          const isLocal = ['localhost', '127.0.0.1', '0.0.0.0'].includes(location.hostname);
          if (isLocal) {
            navigator.serviceWorker.getRegistrations()
              .then((regs) => Promise.all(regs.map((reg) => reg.unregister())))
              .then(() => caches?.delete?.('siliconstream-v1'))
              .catch((err) => console.log('SW cleanup failed:', err));
            return;
          }
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => {
              console.log('SW registered:', reg.scope);
            })
            .catch((err) => {
              console.log('SW registration failed:', err);
            });
        });
      }
    </script>

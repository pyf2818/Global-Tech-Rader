  <body>
    <div id="root"></div>
    <script>
      window.onerror = function (message, source, line, column, error) {
        const root = document.getElementById('root');
        if (!root) return;

        const panel = document.createElement('div');
        panel.style.cssText = 'padding:32px;color:#ff6b6b;font-family:monospace;background:#0a0a0f;min-height:100vh';
        const title = document.createElement('h2');
        title.textContent = '页面加载失败';
        const details = document.createElement('pre');
        details.style.cssText = 'white-space:pre-wrap;font-size:13px';
        details.textContent = `${message}\n${source || ''}:${line || 0}:${column || 0}${error?.stack ? `\n\n${error.stack}` : ''}`;
        const reload = document.createElement('button');
        reload.type = 'button';
        reload.textContent = '重新加载';
        reload.style.cssText = 'margin-top:16px;padding:8px 16px;cursor:pointer';
        reload.addEventListener('click', () => location.reload());
        panel.append(title, details, reload);
        root.replaceChildren(panel);
      };
    </script>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          const isLocal = ['localhost', '127.0.0.1', '0.0.0.0'].includes(location.hostname);
          if (isLocal) {
            navigator.serviceWorker.getRegistrations()
              .then((registrations) => Promise.all(registrations.map((registration) => registration.unregister())))
              .then(() => window.caches?.delete?.('siliconstream-v1'))
              .catch((error) => console.warn('Service worker cleanup failed:', error));
            return;
          }
          navigator.serviceWorker.register('/sw.js')
            .catch((error) => console.warn('Service worker registration failed:', error));
        });
      }
    </script>
  </body>

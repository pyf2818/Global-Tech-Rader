services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: siliconstream-app
    ports:
      - "${APP_PORT:-80}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://meridian:${DB_PASSWORD}@postgres:5432/silicon_meridian
      DATABASE_SSL: "false"
      SCRAPLING_URL: ${SCRAPLING_URL:-http://host.docker.internal:5000}
      AI_ALLOWED_HOSTS: ${AI_ALLOWED_HOSTS:-}
      AI_ALLOW_PRIVATE_NETWORK: ${AI_ALLOW_PRIVATE_NETWORK:-false}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - siliconstream-network

  postgres:
    image: postgres:15-alpine
    container_name: siliconstream-db
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: silicon_meridian
      POSTGRES_USER: meridian
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meridian -d silicon_meridian"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - siliconstream-network

volumes:
  postgres_data:

networks:
  siliconstream-network:
    driver: bridge

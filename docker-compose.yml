services:
  tech-radar:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tech-radar-app
    ports:
      - "80:80"      # 前端访问
      - "5000:5000"  # Scrapling API
    environment:
      - PYTHONUNBUFFERED=1
      - FLASK_ENV=production
      - NODE_ENV=production
      - DATABASE_URL=postgresql://meridian:${DB_PASSWORD}@postgres:5432/silicon_meridian
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      # 持久化日志
      - ./logs:/var/log/nginx
      - ./scrapling-logs:/var/log/scrapling
    networks:
      - tech-radar-network

  postgres:
    image: postgres:15-alpine
    container_name: silicon-meridian-db
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: silicon_meridian
      POSTGRES_USER: meridian
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meridian -d silicon_meridian"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - tech-radar-network

  # 可选：Redis 缓存
  # redis:
  #   image: redis:7-alpine
  #   container_name: tech-radar-redis
  #   command: redis-server --appendonly yes
  #   volumes:
  #     - redis_data:/data
  #   restart: unless-stopped
  #   networks:
  #     - tech-radar-network

volumes:
  postgres_data:
  redis_data:

networks:
  tech-radar-network:
    driver: bridge
